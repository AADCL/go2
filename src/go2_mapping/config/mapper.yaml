input_cloud: /cloud_registered_odom
input_odom: /odom_nav
static_scan_topic: /go2_mapping/static_scan
static_map_topic: /go2_mapping/static_map_cloud
dynamic_topic: /go2_mapping/dynamic_points

min_range: 0.50
max_range: 50.0
scan_voxel_size: 0.05

radius_filter:
  enable: true
  radius: 0.15
  min_neighbors: 2

self_filter:
  enable: false
  min_x: -0.55
  max_x: 0.55
  min_y: -0.45
  max_y: 0.45
  min_z: -0.40
  max_z: 0.25

dynamic_filter:
  enable: true
  voxel_size: 0.20
  hit_probability: 0.70
  miss_probability: 0.40
  occupied_probability: 0.72
  clearing_probability: 0.35
  min_hit_scans: 8
  min_observation_span: 2.0
  ray_stride: 4
  max_clearing_range: 20.0
  ray_endpoint_margin: 0.30
  candidate_timeout: 5.0
  cleanup_period: 1.0
  max_voxels: 2000000

map:
  voxel_size: 0.05
  max_voxels: 5000000
  autosave_period: 0.0
  save_on_shutdown: false

map_publish_period: 2.0
publish_dynamic_points: false
max_odom_age: 0.20
